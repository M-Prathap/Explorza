
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adventure Details | Explorza</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark explorza-navbar">
        <div class="container">

            <a class="navbar-brand brand-logo" href="index.html">
                ✧ EXPLORZA
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="adventures.html">Adventures</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>


    <!-- Adventure Details -->
    <section class="details-section">
        <div class="container">

            <a href="adventures.html" class="back-link">
                ← Back to Adventures
            </a>

            <div class="row g-5 mt-3">

                <!-- Image -->
                <div class="col-lg-7">

                    <img id="adventureImage"
                        class="details-image"
                        src=""
                        alt="Adventure">

                </div>

                <!-- Information -->
                <div class="col-lg-5">

                    <span id="adventureCategory"
                        class="adventure-category"></span>

                    <h1 id="adventureTitle" class="details-title"></h1>

                    <p id="adventureDescription"></p>

                    <div class="details-info">

                        <div>
                            <span>Duration</span>
                            <strong id="adventureDuration"></strong>
                        </div>

                        <div>
                            <span>Price Per Person</span>
                            <strong id="adventurePrice"></strong>
                        </div>

                    </div>

                    <!-- Booking Form -->
                    <div class="booking-card">

                        <h3>Book Your Adventure</h3>

                        <label for="bookingDate">Select Date</label>
                        <input type="date" id="bookingDate"
                            class="form-control mb-3">

                        <label for="peopleCount">Number of People</label>
                        <input type="number" id="peopleCount"
                            class="form-control mb-3"
                            min="1" value="1">

                        <div class="d-flex justify-content-between mb-3">
                            <strong>Total Amount</strong>
                            <strong id="totalPrice">₹2,500</strong>
                        </div>

                        <button class="btn btn-primary w-100"
                            id="bookButton">
                            Book Now
                        </button>

                        <p id="bookingMessage" class="mt-3 mb-0"
                            aria-live="polite"></p>

                    </div>

                </div>

            </div>

        </div>
    </section>


    <!-- Footer -->
    <footer class="footer">
        <div class="container text-center">
            <a class="footer-logo" href="index.html">EXPLORZA</a>
            <p>Discover Beyond Limits.</p>
            <p class="copyright">
                © 2026 Explorza. All rights reserved.
            </p>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/adventure-details.js"></script>

</body>
</html>
